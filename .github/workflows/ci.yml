# ref: ADR-0010 — 各ジョブ失敗時はジョブ名と本 ADR §2.1 / §2.4.x を参照すること
#
# 第三者 action はすべて commit SHA で pin (ADR-0010 §2.3 / §5)。
#   `# vX.Y.Z` 形式のバージョンコメントを SHA の右に併記する。
#   master / mutable tag 直参照は禁止。dependabot が SHA を更新する PR を出す。
name: "CI (ref: ADR-0010)"

# GITHUB_TOKEN 最小権限 (ADR-0010 §2.10 / Round 5 Critical C-1 対応)
# write 権限が必要なジョブは job 単位で permissions: を上書きすること
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    # paths-ignore は撤廃 (ADR-0010 §7.15.5: GitHub の実挙動では skip された
    # required check は「Expected」のまま BLOCKED になり mergeable にならない)。
    # 課金は public 化 (§1.2 / §2.8) で Free tier 無制限のため doc-only PR でも
    # 6 ジョブ走らせる方針に変更。
  push:
    branches: [main]
  workflow_dispatch:

# 同一 PR で連続 push したときの古い run を自動キャンセル (ADR-0010 §2.2 / Round 2 M-3)
# push (main) の場合は完走させる
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Linux 上で Tauri 依存を compile / lint するために必要な system パッケージ
      # (https://v2.tauri.app/start/prerequisites/#linux)。Linux は要件 §3.2 で
      # 配布対象外だが、cargo はホスト (Linux) 向けに依存を解決するため install が必要。
      - name: Install Tauri Linux deps
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      # dtolnay/rust-toolchain は `toolchain` input が必須 (rust-toolchain.toml は自動読みしない)。
      # `stable` を渡し、rust-toolchain.toml も `channel = "stable"` で揃える単一ソース運用にする。
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master HEAD pinned
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # lint-rust と test-rust は同じ debug profile のため shared-key を統合 (ADR-0010 §2.6 / Round 2 M-1)
          shared-key: ubuntu-debug
          workspaces: src-tauri
          # PR からの cache 書き込みを禁止 (Round 5 M-2: キャッシュポイズニング防御)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt --check
        if: always()
        run: cargo fmt --check
      - name: cargo clippy
        if: always()
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Forbidden patterns (grep fallback, ADR-0010 §2.5)
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ! grep -rn --include='*.rs' \
              -e 'std::thread::spawn' \
              -e 'std::thread::Builder::spawn' \
              -e 'tokio::task::spawn_blocking' \
              -e 'tokio::runtime::Handle::block_on' \
              -e 'rayon::' \
              src-tauri/src

  test-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # lint-rust と同じく Linux Tauri deps が必要 (cargo がホスト向けに依存解決するため)
      - name: Install Tauri Linux deps
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master HEAD pinned
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ubuntu-debug # lint-rust と統合 (debug profile 共有)
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # ADR-0010 §7.12 / Round 1 M-6: --lib でライブラリターゲットのみ
      # (Tauri バイナリの統合 test はヘッドレス CI で fail するため対象外)
      - run: cargo test --workspace --lib --all-features --locked

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # tsc が落ちても eslint / prettier は走らせる (Round 2 M-5: 集約失敗パターン)
      - run: npx eslint .
        if: always()
      - run: npx prettier --check .
        if: always()

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run --passWithNoTests
        if: always()
      - run: npm run build
        if: always()

  build-tauri:
    name: build-tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            archive_suffix: macos_aarch64
            rust_targets: aarch64-apple-darwin
          - os: windows-latest
            platform: windows
            archive_suffix: windows_x64
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master HEAD pinned
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build-${{ matrix.os }}
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Verify release candidate version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/release/release-contract.mjs check-version "${VERSION}" .

      # package-lock.jsonで固定したTauri CLIとCargo.lockで再現可能な配布物を作る。
      - name: Build macOS app bundle
        if: matrix.platform == 'macos'
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app -- --locked

      - name: Package macOS portable ZIP
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APP_PATH: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/MyMyTools.app
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE_NAME="MyMyTools_${VERSION}_${{ matrix.archive_suffix }}.zip"
          test -d "${APP_PATH}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ARCHIVE_NAME}"
          unzip -t "${ARCHIVE_NAME}"

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        run: npm run tauri -- build --no-bundle -- --locked

      - name: Package Windows portable ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./package.json').version"
          $archiveName = "MyMyTools_${version}_${{ matrix.archive_suffix }}.zip"
          $source = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/mym-tools.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Windows executable not found: $source"
          }

          $staging = Join-Path $env:RUNNER_TEMP "mym-tools-ci-portable"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $staging "MyMyTools.exe")
          Compress-Archive `
            -LiteralPath (Join-Path $staging "MyMyTools.exe") `
            -DestinationPath (Join-Path $env:GITHUB_WORKSPACE $archiveName) `
            -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead(
            (Join-Path $env:GITHUB_WORKSPACE $archiveName)
          )
          try {
            if ($zip.Entries.Count -ne 1 -or $zip.Entries[0].FullName -ne "MyMyTools.exe") {
              throw "Unexpected Windows portable ZIP contents"
            }
          }
          finally {
            $zip.Dispose()
          }

      - name: Create release candidate manifest
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE_NAME="MyMyTools_${VERSION}_${{ matrix.archive_suffix }}.zip"
          export CANDIDATE_VERSION="${VERSION}"
          export CANDIDATE_SOURCE_COMMIT="$(git rev-parse HEAD)"
          export CANDIDATE_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export CANDIDATE_TAURI_CLI_VERSION="$(npx --no-install tauri --version)"
          export CANDIDATE_RUST_VERSION="$(rustc --version)"
          node scripts/release/release-candidate.mjs create \
            "${{ matrix.platform }}" \
            "${ARCHIVE_NAME}" \
            "release-candidate-${{ matrix.platform }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.platform }}
          path: |
            MyMyTools_*_${{ matrix.archive_suffix }}.zip
            release-candidate-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
