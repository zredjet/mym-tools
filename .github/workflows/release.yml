# ref: ADR-0013 — 手動実行したバージョンのportable ZIPを、全OSビルド成功後に公開する。
#
# 第三者 action はすべてcommit SHAでpinし、右側にバージョンコメントを併記する。
# 第三者Actionのmutable tag / branch直参照は禁止。dependabotがSHA更新PRを作成する。
name: "Release (ref: ADR-0013)"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン (例: 0.1.0-alpha.4)。push済みの v<version> tag が必要"
        required: true
        type: string

# 手動リリース全体を直列化する。既存実行はキャンセルせず完走させる。
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_sha: ${{ steps.source.outputs.release_sha }}
    steps:
      # workflow_dispatchで選択したrefの検証スクリプトを取得する。
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Require main workflow
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release workflow must be dispatched from main: ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Normalize release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/release/release-contract.mjs normalize "${INPUT_VERSION}" >> "${GITHUB_OUTPUT}"

      # ユーザー入力から導出したtag commitを別ディレクトリへcheckoutする。
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          path: release-source

      - name: Verify version files and pin release commit
        id: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/release-contract.mjs check-version "${RELEASE_VERSION}" release-source
          echo "release_sha=$(git -C release-source rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Reject an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          EXISTING_TAGS="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name')"
          if grep -Fxq "${RELEASE_TAG}" <<< "${EXISTING_TAGS}"; then
            echo "Release ${RELEASE_TAG} already exists; published releases are immutable" >&2
            exit 1
          fi

  build-portable:
    name: Build portable ZIP (${{ matrix.os }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            archive_suffix: macos_aarch64
            rust_targets: aarch64-apple-darwin
          - os: windows-latest
            platform: windows
            archive_suffix: windows_x64
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_NAME: MyMyTools_${{ needs.validate-release.outputs.version }}_${{ matrix.archive_suffix }}.zip
    steps:
      # tag移動の影響を受けないよう、検証済みcommit SHAを直接checkoutする。
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
          submodules: true

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master HEAD pinned
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-portable-${{ matrix.os }}
          workspaces: src-tauri
          save-if: "true"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: taiki-e/install-action@7ea35f098a7369cd23488403f58be9c491a6c55f # v2.77.0
        with:
          tool: tauri-cli

      # macOSは.app bundleだけを生成し、DMGは作らない。
      - name: Build macOS app bundle
        if: matrix.platform == 'macos'
        working-directory: src-tauri
        run: cargo tauri build --target aarch64-apple-darwin --bundles app

      - name: Package macOS portable ZIP
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APP_PATH: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/MyMyTools.app
        run: |
          set -euo pipefail
          test -d "${APP_PATH}"
          ditto -c -k --sequesterRsrc --keepParent \
            "${APP_PATH}" "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}"
          unzip -t "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}"

      # Windowsはinstallerを生成せず、release executableをZIP化する。
      - name: Build Windows executable
        if: matrix.platform == 'windows'
        working-directory: src-tauri
        run: cargo tauri build --no-bundle

      - name: Package Windows portable ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/mym-tools.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Windows executable not found: $source"
          }

          $staging = Join-Path $env:RUNNER_TEMP "mym-tools-portable"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $staging "MyMyTools.exe")

          $archive = Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE_NAME
          Compress-Archive `
            -LiteralPath (Join-Path $staging "MyMyTools.exe") `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            if ($zip.Entries.Count -ne 1 -or $zip.Entries[0].FullName -ne "MyMyTools.exe") {
              throw "Unexpected Windows portable ZIP contents"
            }
          }
          finally {
            $zip.Dispose()
          }

      # if-no-files-found:errorで成果物欠落をjob成功にしない。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-${{ matrix.platform }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [validate-release, build-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
      IS_PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
    steps:
      # 検証スクリプトはmain、release notesとtag再検証はtag commitから取得する。
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          fetch-depth: 0
          path: release-source

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: portable-*
          path: release-assets
          merge-multiple: true

      - name: Verify tag and portable ZIP set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C release-source rev-parse HEAD)"
          if [[ "${ACTUAL_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "Tag ${RELEASE_TAG} moved during the workflow" >&2
            echo "expected=${RELEASE_SHA} actual=${ACTUAL_SHA}" >&2
            exit 1
          fi
          if ! PREVIOUS_ASSET_SIZES_JSON="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '(map(select(.draft == false))[0].assets // [])
              | map(
                  select(
                    (.name | endswith("_macos_aarch64.zip")) or
                    (.name | endswith("_windows_x64.zip"))
                  )
                  | {
                      key: (if (.name | endswith("_macos_aarch64.zip"))
                        then "macos_aarch64"
                        else "windows_x64"
                      end),
                      value: .size
                    }
                )
              | from_entries' 2>/dev/null)"; then
            PREVIOUS_ASSET_SIZES_JSON='{}'
          fi
          export PREVIOUS_ASSET_SIZES_JSON
          node scripts/release/release-contract.mjs \
            check-assets "${RELEASE_VERSION}" release-assets | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Create, upload, and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PRERELEASE_ARGS=()
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          CREATED_BY_THIS_RUN=0
          cleanup_failed_draft() {
            status=$?
            if [[ ${status} -ne 0 && ${CREATED_BY_THIS_RUN} -eq 1 ]]; then
              IS_DRAFT="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' || true)"
              if [[ "${IS_DRAFT}" == "true" ]]; then
                echo "Deleting incomplete draft release ${RELEASE_TAG}" >&2
                gh release delete "${RELEASE_TAG}" --yes || true
              fi
            fi
            exit "${status}"
          }
          trap cleanup_failed_draft EXIT

          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            "${PRERELEASE_ARGS[@]}" \
            --notes-file release-source/scripts/release/release-notes.md
          CREATED_BY_THIS_RUN=1

          gh release upload "${RELEASE_TAG}" \
            "release-assets/MyMyTools_${RELEASE_VERSION}_macos_aarch64.zip" \
            "release-assets/MyMyTools_${RELEASE_VERSION}_windows_x64.zip"
          gh release edit "${RELEASE_TAG}" --draft=false

          trap - EXIT
