# ref: ADR-0008 (配布は portable 差し替え方式 / 自動更新なし) — 各 OS のバンドルを
# GitHub Releases にアップロードして、ユーザーが手動 DL → 既存アプリと差し替える運用。
#
# 第三者 action はすべて commit SHA で pin (ADR-0010 §2.3 / §5)。
#   `# vX.Y.Z` 形式のバージョンコメントを SHA の右に併記する。
#   master / mutable tag 直参照は禁止。
#
# トリガー: `v*` パターンのタグ push (例: `v0.1.0-alpha.1`、`v0.1.0`)。
# 各 OS で `cargo tauri build` (デフォルト bundle targets="all") を実行し、生成された
# DMG (macOS) / MSI + NSIS exe (Windows) を gh release upload で添付する。
#
# ## ジョブ構成 (PR #37 codex P1 / P2 反映)
#
# 1. `create-release`: ubuntu-latest で tag を checkout し、`gh release create
#    --verify-tag` で Release を 1 度だけ作成 (重複は exit ガード)。
#    `--verify-tag` により push されていないタグからは作れない (workflow_dispatch
#    での typo 防止)。
# 2. `build-and-upload`: macos / windows マトリックスで `create-release` 完了後に
#    走り、tag commit を checkout してビルド → `gh release upload --clobber` で
#    バンドル添付。ジョブを 2 段階に分けることで Release 作成のレースを根絶する。

name: "Release (ref: ADR-0008)"

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "タグ名 (例: v0.1.0-alpha.1)。事前に push されている tag のみ受理"
        required: true
        type: string

# 同タグへの連続 push (typo 修正等) で古い run を自動キャンセル
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  create-release:
    name: Ensure GitHub Release exists
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create に必要
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # 該当タグを明示的に checkout (workflow_dispatch で別ブランチから走らせても
      # tag commit でのみ動作することを保証、PR #37 codex P1)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Create release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping create"
            exit 0
          fi
          # alpha / beta / rc を含むタグは prerelease 扱い
          PRE_FLAG=""
          case "${TAG}" in
            *alpha*|*beta*|*rc*) PRE_FLAG="--prerelease" ;;
          esac
          # 改行入りリリースノートを heredoc で渡す
          NOTES_FILE="$(mktemp)"
          cat > "${NOTES_FILE}" <<'EOF'
          # MyMyTools

          個人用ローカルツールの集合体 — プロンプト管理 / リンク・メモ / カラー / ハッシュ計算。

          ## 含まれるバンドル

          - **macOS**: `MyMyTools_*_aarch64.dmg` (Apple Silicon 専用 / Intel Mac 非対応)
          - **Windows**: `MyMyTools_*-setup.exe` (NSIS インストーラー、x64)

          ## インストール

          1. このページの Assets から自分の OS のファイルをダウンロード
          2. **macOS**: DMG を開いて `MyMyTools.app` を Applications にドラッグ
          3. **Windows**: NSIS exe (`MyMyTools_*-setup.exe`) を実行

          ## OS 警告 / 起動エラー対処 (alpha のためコード署名なし)

          ### Windows

          SmartScreen の「不明な発行元」警告 → 「詳細情報 > 実行」 をクリック。

          ### macOS

          ⚠️ **「MyMyTools は壊れているため、起動できません」と表示される場合**

          実際にバイナリは壊れていません。インターネット経由 DL したファイルに付与
          される `com.apple.quarantine` 属性 + 未署名アプリの組合せで Gatekeeper が
          ブロックしているだけです。ターミナルで以下を実行して quarantine 属性を
          外せば起動できます (Apple Silicon Mac で確認済):

          ```bash
          xattr -dr com.apple.quarantine /Applications/MyMyTools.app
          ```

          実行後、通常通り `MyMyTools.app` をダブルクリックで起動。

          ### より詳しい状態を見る (上記コマンドで起動しない場合)

          ```bash
          # Gatekeeper の判定詳細
          spctl --assess --type execute --verbose=4 /Applications/MyMyTools.app

          # 直近のシステムログ
          log show --last 5m --predicate 'subsystem CONTAINS[c] "syspolicy"' --info

          # 署名状態
          codesign -dvv /Applications/MyMyTools.app
          ```

          恒久対応 (Apple Developer Program + notarization) は Phase 2 で検討予定。

          ## データの保存場所

          - macOS: `~/Library/Application Support/com.zredjet.mymtools/`
          - Windows: `%APPDATA%\com.zredjet.mymtools\`

          バックアップは上記の `backups/` 配下に自動 (起動時 24h ゲート、最新 10 件) +
          破壊操作直前 (最新 30 件) + 手動 (無制限) の 3 系統で保存されます。
          設定画面 (⌘, / Settings) からリストア可能です。

          ## 自動更新について

          ADR-0008 通り **自動更新は提供しません**。新版は同じ Releases ページから手動
          でダウンロードしてアプリを差し替えてください。データ (`data.sqlite`) は維持されます。

          ## バグ報告 / フィードバック

          [GitHub Issues](https://github.com/zredjet/mym-tools/issues) にお願いします。
          EOF
          # `--verify-tag`: push されていないタグや別 ref から手元生成された名前を弾く
          # (PR #37 codex P1: workflow_dispatch typo 防止)
          gh release create "${TAG}" \
            --title "${TAG}" \
            --verify-tag \
            ${PRE_FLAG} \
            --notes-file "${NOTES_FILE}"

  build-and-upload:
    name: Build & upload (${{ matrix.os }})
    needs: create-release
    permissions:
      contents: write # gh release upload に必要
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # macOS: Apple Silicon (arm64) 専用ビルド。alpha.1 は GitHub macos-latest
            # runner の host architecture (現状 arm64) でビルドされたため、target を
            # 明示しなくても arm64 dmg は出ていたが、本 PR で `--target
            # aarch64-apple-darwin` を明示し、配布対象が Apple Silicon である事を
            # workflow / 出力 path 双方ではっきりさせる。
            # Intel Mac 対応 (universal binary) は Phase 1 では追わない方針 (alpha
            # ユーザー想定が Apple Silicon)
            rust_targets: "aarch64-apple-darwin"
            tauri_target_arg: "--target aarch64-apple-darwin"
            bundle_glob: "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
          - os: windows-latest
            # Windows は NSIS exe のみ (MSI は WiX が pre-release 文字列を受理しないため
            # `bundle.targets` から除外、`tauri.conf.json` 参照)。host target でビルド
            rust_targets: ""
            tauri_target_arg: ""
            bundle_glob: "src-tauri/target/release/bundle/nsis/*.exe"
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # tag commit を明示的に checkout (PR #37 codex P1: workflow_dispatch で別 ref
      # を選んでも、tag が指す commit でのみビルドする)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # `targets:` は空白区切りで複数指定可。空文字なら host target のみ
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master HEAD pinned
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-${{ matrix.os }}
          workspaces: src-tauri
          # Tag からのリリースビルドは tag commit から走る想定で、キャッシュ書き込み許可
          save-if: "true"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # tauri-cli は taiki-e/install-action の managed manifest 外のため
      # 既定 fallback の cargo-binstall で取得される (ADR-0010 §2.3 / Round 8 C-1)
      - uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: tauri-cli

      # Release ビルド: bundle を生成 (--no-bundle を付けない)。macOS は
      # `--target universal-apple-darwin` で Apple Silicon + Intel の universal binary
      - name: Tauri release build
        working-directory: src-tauri
        run: cargo tauri build ${{ matrix.tauri_target_arg }}

      # bundle をアップロード (`--clobber` で再 run 時の上書きを許容)。
      # Release は `create-release` ジョブで作成済 (PR #37 codex P2: レース回避)
      - name: Upload bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          # matrix.bundle_glob は空白区切りの複数 path / glob
          # shellcheck disable=SC2086
          for pattern in ${{ matrix.bundle_glob }}; do
            for f in $pattern; do
              if [ -f "$f" ]; then
                echo "Uploading: $f"
                gh release upload "${TAG}" "$f" --clobber
              fi
            done
          done
