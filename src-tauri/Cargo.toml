[package]
name = "mym-tools"
version = "0.1.0-alpha.9"
description = "MyMyTools — 軽量なクロスプラットフォーム多目的 GUI ツール"
authors = ["zredjet"]
edition = "2021"
rust-version = "1.88"  # lopdf 0.44 の MSRV。rust-toolchain.toml は stable を追従する。

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mym_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 本体 (ADR-0001)
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"   # ADR-0008 §2.7: 「最新版を確認」で OS 既定ブラウザ起動
tauri-plugin-dialog = "2"   # PR-Z: Export/Import の save / open ファイルダイアログ (D-05)
tauri-plugin-os = "2"       # PR-AF: About 画面の Platform 表示 (OS 名 / arch / version)

# DB (ADR-0003)
# 注: bundled feature が SQLite を `SQLITE_ENABLE_FTS5` 等を有効化してビルドするため、
# 明示の `fts5` feature は不要 (rusqlite 0.32〜0.39 系で同じ挙動)。
rusqlite = { version = "0.39", features = ["bundled", "trace", "backup"] }

# 非同期 (Tauri 同梱、ADR-0009)
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", default-features = false }   # ADR-0009: CancellationToken

# シリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39.2"
base64 = "0.22.1"
percent-encoding = "2"

# エラー (ADR-0009: AppError / ModuleError)
thiserror = "1"

# 時刻 (ADR-0005: JST ISO8601 アプリ側生成)
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# ロギング (architecture.md §10.2)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# UUID (ADR-0009: operation_id)
uuid = { version = "1", features = ["v4", "serde"] }

# M-HTTP: CORS に依存しない native HTTP client (ADR-0015)
reqwest = { version = "0.13.3", default-features = false, features = ["native-tls", "charset", "http2"] }

# ハッシュ計算 (M-Hash)
# digest 0.10 系は md-5 / sha1 / sha2 0.10 が既に間接依存しているバージョン。
# `DynDigest` (object-safe) を使ってアルゴリズム別の dyn dispatch をする。
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

# M-PDF Merge: 非暗号化PDFの検査・ページツリー結合。展開サイズ上限を使うため0.44以上。
lopdf = { version = "0.44", default-features = false }
# lopdf 0.44の許容範囲でaes 0.9.3を選ぶとRust 1.89が必要になるため、MSRV 1.88対応版へ固定する。
aes = "=0.9.2"

[dev-dependencies]
# 一時ファイル / 一時ディレクトリ (M-Hash ファイルハッシュテストで使う)。
# 既に tauri 等の transitive dep として Cargo.lock に存在するため新規 dl は発生しない。
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# `settings.json.tmp` を既存 `settings.json` へ原子的に置換するために使用する。
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
