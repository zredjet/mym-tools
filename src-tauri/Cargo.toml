[package]
name = "mym-tools"
version = "0.1.0-alpha.21"
description = "MyMyTools — 軽量なクロスプラットフォーム多目的 GUI ツール"
authors = ["zredjet"]
edition = "2021"
rust-version = "1.88"  # lopdf 0.45 の MSRV。rust-toolchain.toml は stable を追従する。
# 依存の新しい版が rust-version を満たさない時は満たす版を選ぶ (cargo update / cargo add)。
# resolver 2 から変わるのはこの既定値だけで、feature の統合は同じ。
# [workspace] に置くと crates/shotq が member になるため [package] に置く。
resolver = "3"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mym_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 本体 (ADR-0001)。2.11.6 は GHSA-w28w-mhc8-qvjv の修正版。
# 2.12 は Rust 1.90 が必要で、npm の @tauri-apps/* と major.minor をそろえて上げる必要があるため 2.11 系に留める。
tauri = { version = "~2.11.6", features = [] }
tauri-plugin-opener = "2"   # ADR-0008 §2.7: 「最新版を確認」で OS 既定ブラウザ起動
tauri-plugin-dialog = "2"   # PR-Z: Export/Import の save / open ファイルダイアログ (D-05)
tauri-plugin-os = "2"       # PR-AF: About 画面の Platform 表示 (OS 名 / arch / version)
tauri-plugin-shell = "2"    # M-NRBF: 専用NativeAOT sidecarをRustバックエンドからのみ起動

# DB (ADR-0003)
# 注: bundled feature が SQLite を `SQLITE_ENABLE_FTS5` 等を有効化してビルドするため、
# 明示の `fts5` feature は不要 (rusqlite 0.32〜0.39 系で同じ挙動)。
rusqlite = { version = "0.40", features = ["bundled", "trace", "backup"] }

# 非同期 (Tauri 同梱、ADR-0009)
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }   # ADR-0009: CancellationToken

# シリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RUSTSEC-2026-0194 / 0195 の修正版。0.42 は API を &str へ全面変更するため別に移行する。
quick-xml = "0.41.0"
base64 = "0.22.1"
percent-encoding = "2"

# エラー (ADR-0009: AppError / ModuleError)
thiserror = "1"

# 時刻 (ADR-0005: JST ISO8601 アプリ側生成)
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# ロギング (architecture.md §10.2)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# UUID (ADR-0009: operation_id)
uuid = { version = "1", features = ["v4", "serde"] }

# M-HTTP: CORS に依存しない native HTTP client (ADR-0015)
reqwest = { version = "0.13.3", default-features = false, features = ["native-tls", "charset", "http2"] }
# M-HTTP: 応答本文を Content-Type の charset で復号する (reqwest の charset feature が既に依存)
encoding_rs = "0.8"

# ハッシュ計算 (M-Hash)
# digest 0.10 系は md-5 / sha1 / sha2 0.10 が既に間接依存しているバージョン。
# `DynDigest` (object-safe) を使ってアルゴリズム別の dyn dispatch をする。
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

# M-PDF Merge: 非暗号化PDFの検査・ページツリー結合。展開サイズ上限 (0.44〜) と、
# 相互参照streamの巨大な/W幅でabortしない修正 (0.45、lopdf #532) を使うため0.45以上。
lopdf = { version = "0.45", default-features = false }
# lopdf 0.45の許容範囲 (aes ^0.9) でaes 0.9.3を選ぶとRust 1.89が必要になるため、MSRV 1.88対応版へ固定する。
aes = "=0.9.2"

# M-PNG最適化 (ADR-0023): shotq のライブラリ部分を複製して path 依存にする。複製元は crates/shotq/UPSTREAM.md。
# 出力のバイト列を shotq の CLI と一致させるため、出力に効く依存 (zlib-rs / flate2 / png / qcms / fdeflate) は
# Cargo.lock で shotq と同じ版に固定し、契約テスト (modules/pngopt) で確かめる。
shotq = { path = "crates/shotq" }

[dev-dependencies]
# 一時ファイル / 一時ディレクトリ (M-Hash ファイルハッシュテストで使う)。
# 既に tauri 等の transitive dep として Cargo.lock に存在するため新規 dl は発生しない。
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# `settings.json.tmp` を既存 `settings.json` へ原子的に置換するために使用する。
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# ADR-0023: shotq は依存として使うとアプリのプロファイルに従う。LTO は crate 単位で指定できないので、
# shotq の配布ビルド (lto = "fat") との速度差は ADR-0023 に実測を記録する。
[profile.release.package.shotq]
opt-level = 3
codegen-units = 1
